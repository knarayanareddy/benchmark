name: verify
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Ingest the real export
        run: python3 scripts/ingest.py
      - name: Regenerate the baselines (writes data/baseline-fit.json)
        run: npm run ladder
      - name: Regenerate the authoring worklist
        run: npm run worklist
      - name: The committed data must match a fresh ingest, fit and worklist
        run: git diff --exit-code data/
      - name: Every check, with a pass/fail table
        run: npm run verify
      - name: Dependency audit
        run: npm run audit
