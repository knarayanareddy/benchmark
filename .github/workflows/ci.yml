name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # CI used to re-list every gate by hand. It drifted: the numbers gate and
      # the privacy gate were both added to package.json before they were added
      # here, so for two commits CI was green on a tree `npm run verify` rejected.
      # One entry point, asserted by scripts/check-ci.mjs.
      - name: Full verification (tests + every gate)
        run: npm run verify

      - name: Ingest the published export from scratch
        run: python3 scripts/ingest.py

      - name: The committed data must match a fresh ingest
        run: git diff --exit-code data/

      - name: Backtest harness
        run: node scripts/backtest.mjs
