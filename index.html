<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Ground Truth Circle…</title>
  <meta http-equiv="refresh" content="0; url=https://ground-truth-circle.onrender.com/">
  <link rel="canonical" href="https://ground-truth-circle.onrender.com/">
  <script>
    const target = "https://ground-truth-circle.onrender.com" + window.location.pathname.replace(/^\/benchmark/, '') + window.location.search + window.location.hash;
    window.location.replace(target || "https://ground-truth-circle.onrender.com/");
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1f2937;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #14b8a6;
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="margin: 0 0 10px 0; font-size: 20px;">Connecting to Ground Truth Circle on Render…</h2>
  <p style="color: #9ca3af; font-size: 14px; max-width: 400px; margin: 0 0 20px 0;">
    Forwarding to the live production server and PostgreSQL database.
  </p>
  <p style="font-size: 13px;">
    If you are not redirected automatically, <a href="https://ground-truth-circle.onrender.com/">click here to enter Ground Truth Circle</a>.
  </p>
</body>
</html>
